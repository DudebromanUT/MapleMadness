<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maple">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9FD3F0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
</style>
<title>Maple's Big Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --ink: #2A2421;
    --soft: #6E625A;
    --card: #FFF8EC;
    --line: #E9DCC4;
    --tan: #C68A4C;
    --tanL: #E2B077;
    --green: #2FA35A;
    --greenD: #1F7A40;
    --gold: #E8C04A;
    --sky: #9FD3F0;
    --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--sky); color: var(--ink); font-family: var(--body);
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; inset: 0; display: block; touch-action: none; }

  /* in-game bar */
  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .hud-mid { text-align: center; pointer-events: none; }
  .hud-title { font: 800 13px var(--body); letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
  .hud-time { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
  .hud-right { display: flex; gap: 8px; align-items: center; }
  .hud-score {
    font: 800 15px var(--body); background: var(--card); border: 2px solid var(--ink);
    border-radius: 999px; padding: 6px 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .icon-btn {
    min-width: 40px; height: 40px; padding: 0 10px; border-radius: 20px;
    border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    font: 800 12px var(--body); letter-spacing: .04em; cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; overflow-y: auto;
    display: flex; justify-content: center; align-items: flex-start;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  .overlay.dim { background: rgba(42,36,33,.35); }
  .overlay.bottom { align-items: flex-end; }
  .card {
    width: min(440px, 100%); margin: auto 0;
    background: var(--card); border: 2.5px solid var(--ink); border-radius: 24px;
    box-shadow: 0 6px 0 var(--ink);
    padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .overlay.bottom .card { margin: 0; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  h1, h2 { font-family: var(--display); font-weight: 800; margin: 0; line-height: .95; text-wrap: balance; }
  h1 { font-size: clamp(40px, 12vw, 56px); color: var(--ink); }
  h1 em { font-style: normal; color: var(--tan); }
  h2 { font-size: 32px; }
  #hero { width: 100%; height: 170px; display: block; border-radius: 16px; border: 2px solid var(--ink); background: #BFE3F5; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  .field input {
    font: 700 16px var(--body); color: var(--ink); background: #fff;
    border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box;
    -webkit-user-select: text; user-select: text;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 800 13px var(--body); padding: 6px 12px; border-radius: 999px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .seg button { font: 800 13px var(--body); padding: 8px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

  .levels { display: grid; gap: 10px; }
  .lvl {
    display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
    text-align: left; width: 100%;
    background: #fff; border: 2px solid var(--ink); border-radius: 16px; padding: 10px 12px;
    box-shadow: 0 3px 0 var(--ink); cursor: pointer; color: var(--ink); font-family: var(--body);
  }
  .lvl:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .lvl .num {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--tan); color: #fff; font: 800 22px var(--display); border: 2px solid var(--ink);
  }
  .lvl .nm { font: 800 19px/1.1 var(--display); }
  .lvl .pl { font-size: 12px; font-weight: 700; color: var(--soft); }
  .lvl .top { font-size: 12px; font-weight: 700; color: var(--greenD); }
  .stars { font-size: 20px; letter-spacing: 1px; color: #D8CDBB; white-space: nowrap; }
  .stars b { color: var(--gold); font-weight: 400; text-shadow: 0 1px 0 #A8801C; }
  .how { margin: 0; font-size: 15px; line-height: 1.5; max-width: 60ch; }
  .play {
    font-family: var(--display); font-weight: 800; font-size: 22px;
    color: #fff; background: var(--green); border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 9px 22px; cursor: pointer; box-shadow: 0 5px 0 var(--ink);
  }
  .play:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .ghost { font: 800 14px var(--body); background: transparent; color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  .bigstars { font-size: 46px; letter-spacing: 6px; color: #D8CDBB; line-height: 1; }
  .bigstars b { color: var(--gold); font-weight: 400; text-shadow: 0 2px 0 #A8801C; }
  .stat { font-size: 15px; font-weight: 700; line-height: 1.5; margin: 0; }
  .fam { font-size: 13px; color: var(--soft); margin: 0; }
  .foot { font-size: 12px; color: var(--soft); margin: 0; }
  .banner-new { align-self: flex-start; background: var(--gold); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: 13px; }
</style>
</head>
<body>

<canvas id="c" aria-label="Maple's Big Day game area"></canvas>

<div class="hud" id="hud" hidden>
  <button class="icon-btn" id="exitBtn" aria-label="Back to levels">&#x2715;</button>
  <div class="hud-mid"><div class="hud-title" id="hudTitle"></div><div class="hud-time" id="hudTime">45</div></div>
  <div class="hud-right"><div class="hud-score" id="hudScore"></div><button class="icon-btn" id="mute" aria-label="Toggle sound">SND</button></div>
</div>

<div class="overlay dim" id="menu">
  <div class="card">
    <div class="kicker" id="mKicker">Millcreek, Utah</div>
    <h1 id="mTitle">Maple's <em>Big Day</em></h1>
    <canvas id="hero" aria-label="Maple leaping across the grass"></canvas>
    <div class="field">
      <label for="inPlayer" id="lPlayer">Who's playing?</label>
      <input id="inPlayer" maxlength="14" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Language">
        <button id="langEn" aria-pressed="true">English</button>
        <button id="langEs" aria-pressed="false">Español</button>
      </div>
      <button class="ghost" id="menuSound" aria-pressed="true">Sound on</button>
    </div>
    <div class="levels" id="levels"></div>
    <p class="foot" id="mFoot"></p>
  </div>
</div>

<div class="overlay bottom" id="intro" hidden>
  <div class="card">
    <div class="kicker" id="iKicker"></div>
    <h2 id="iTitle"></h2>
    <p class="how" id="iHow"></p>
    <div class="row">
      <button class="play" id="goBtn">Start</button>
      <button class="ghost" id="backBtn">Levels</button>
    </div>
  </div>
</div>

<div class="overlay dim" id="end" hidden>
  <div class="card">
    <div class="bigstars" id="eStars"></div>
    <h2 id="eTitle"></h2>
    <div class="banner-new" id="eNew" hidden></div>
    <p class="stat" id="eStat"></p>
    <p class="fam" id="eFam"></p>
    <div class="row">
      <button class="play" id="nextBtn">Next level</button>
      <button class="ghost" id="retryBtn">Try again</button>
      <button class="ghost" id="levelsBtn">Levels</button>
    </div>
  </div>
</div>

<script>

    hud: {

    pop: {

  es: {

    start: 'Empezar', levels: 'Niveles', next: 'Siguiente', retry: 'Otra vez', allDone: 'Niveles',
    newBest: 'Nuevo récord personal', famTop: (n, s) => `Récord familiar: ${n} ${s}`, noFam: 'Nadie ha ganado estrellas aquí todavía.',
    lv: {

      chase: { name: 'Atrapa a Fig', place: 'Mediodía · Por toda la casa', how: 'Fig está corriendo por toda la casa y Maple va detrás. Toca para saltar el desorden, toca otra vez en el aire para saltar más alto y agarra premios para alcanzar a Fig.' },
      water: { name: 'A regar el jardín', place: 'Tarde · El jardín', how: 'Mantén el dedo sobre una planta para regarla. Maple quiere saltarte encima. Mantén el dedo sobre Maple para echarle agua con la manguera y Maple saldrá corriendo.' },
      tug: { name: 'Jalar la cuerda', place: 'Noche · La sala', how: 'Toca lo más rápido que puedas para jalar. Cuando Maple gruña, sigue tocando. Toca el anillo dorado cuando coincida para un jalón fuerte.' }
    },
    hud: {
      poop: s => `Recogidos ${s}`, chase: s => `Premios ${s}`, water: s => `Jardín ${s}%`, tug: s => `Jalones ${s}`

    pop: {
      scoop: '¡Recogido!', ew: '¡Guácala! Maple lo pisó', fetch: '¡Búscala!', bonk: '¡Epa!', treat: '¡Premio!', hiss: '¡Fsss!',

    cheers: ['¡Chévere!', '¡Burda de bueno!', '¡Dale, dale!'],
    names: { mom: 'Mamá', dad: 'Papá' },
    stages: ['Paseo mañanero', '¡Carreras locas!', 'Maple comió algo raro', 'Está oscureciendo', 'Tormenta de popó', 'Tormenta de popó II', 'Tormenta de popó III', 'El fin del patio'],
    end: {
      poop: (a, b, lv, why) => [why === 'dad' ? 'Papá pisó popó. Se acabó.' : why === 'mom' ? 'Mamá pisó popó. Se acabó.' : a >= 30 ? 'Al final ganó el patio. Pero diste pelea.' : 'Se perdió el patio.', `Recogidos ${a} · Llegaste al nivel ${lv} · Maple pisó ${b}`],

      water: (p, j, z) => [p >= 72 ? 'El jardín sobrevivió.' : 'Las plantas quieren hablar contigo.', `Salud del jardín ${p}% · Saltos encima ${j} · Carreras locas ${z}`],
      tug: (won, t, taps) => [won ? 'Ganaste. Maple no está de acuerdo.' : 'Maple se llevó el juguete de paseo.', won ? `Ganaste en ${t}s · ${taps} jalones` : `${taps} jalones`]

  }
};

/* ============================== SAVE ============================== */
let prof = { player: '', lang: 'en' }, records = {}, muted = false;
try {
  Object.assign(prof, JSON.parse(localStorage.getItem('maple-profile') || '{}'));
  records = JSON.parse(localStorage.getItem('maple-records') || '{}') || {};
  muted = localStorage.getItem('maple-muted') === '1';
} catch (e) {}
const save = () => { try { localStorage.setItem('maple-profile', JSON.stringify(prof)); localStorage.setItem('maple-records', JSON.stringify(records)); } catch (e) {} };
const L = () => T[prof.lang] || T.en;
const playerName = () => prof.player.trim() || L().playerDefault;
const starStr = n => '<b>' + '★'.repeat(n) + '</b>' + '★'.repeat(3 - n);

/* ============================== AUDIO ============================== */
let ac, noiseBuf;
function actx() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function tone(f, dur, type = 'sine', vol = 0.1, slide = 0, delay = 0) {
  if (muted) return;
  try {
    const a = actx(), t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const a = actx();

  } catch (e) {}
}
const sfx = {
  bark: () => { tone(420, 0.08, 'sawtooth', 0.06, -200); noise(0.08, 0.05, 900, 2); tone(400, 0.1, 'sawtooth', 0.06, -220, 0.14); noise(0.1, 0.05, 900, 2, 0.14); },
  jump: () => tone(380, 0.14, 'sine', 0.08, 280),
  scoop: () => { noise(0.12, 0.08, 4200, 0.8); tone(700, 0.08, 'triangle', 0.06, 300, 0.05); },
  plop: () => tone(260, 0.1, 'sine', 0.08, -150),
  squish: () => { noise(0.25, 0.1, 500, 1.5); tone(160, 0.2, 'sine', 0.06, -80); },
  bonk: () => tone(200, 0.2, 'square', 0.05, -110),
  treat: () => { tone(880, 0.07, 'triangle', 0.08); tone(1320, 0.1, 'triangle', 0.07, 0, 0.06); },
  hiss: () => noise(0.5, 0.09, 5000, 0.6),
  growl: () => { tone(90, 0.9, 'sawtooth', 0.05, -20); noise(0.9, 0.04, 300, 3); },
  pull: () => tone(300 + Math.random() * 60, 0.05, 'triangle', 0.04),
  big: () => { tone(520, 0.1, 'square', 0.05); tone(780, 0.16, 'square', 0.05, 0, 0.08); },
  spray: () => noise(0.12, 0.025, 6000, 0.7),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.08, 0, i * 0.11)); },
  lose: () => { [392, 330, 262].forEach((f, i) => tone(f, 0.22, 'triangle', 0.08, 0, i * 0.16)); }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
// iPhone: route sound as media so the silent switch doesn't mute it, and
// (re)start the audio engine on every tap since iOS suspends it freely.
let silentEl = null;
function silentWav() {
  const n = 4000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) b[o + i] = str.charCodeAt(i); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);

}
function unlockAudio() {

/* ============================== LEVEL 1: POOP PATROL (endless) ============================== */
const Poop = {
  id: 'poop', dur: Infinity, stageLen: 20, lawnMax: 7, turbo: 4,
  init() {
    this.t = 0; this.over = false; this.overT = 0;
    this.yTop = VH * 0.46; this.yBot = VH - 34;
    this.scooped = 0; this.squished = 0; this.poops = []; this.bags = []; this.prints = [];
    this.stage = 1; this.stageShown = 0; this.dark = 0;
    this.m = { x: VW * 0.6, y: (this.yTop + this.yBot) / 2, tx: 0, ty: 0, mode: 'run', timer: 0, face: 1, dirty: 0, printT: 0, ball: null, extra: 0 };
    this.kid = { x: VW * 0.25, y: this.yBot - 30, queue: [], scoop: 0, face: 1, walking: false };
    this.walkers = []; this.nextWalker = 7; this.reason = 'lawn'; this.trail = []; this.mowSnd = 0;
    this.target();
    this.nextPoop = 1.0;
    this.balls = Array.from({ length: 4 }, () => ({ x: rand(30, VW - 30), y: rand(this.yTop + 15, this.yBot - 10), z: 0, vx: 0, vy: 0, vz: 0 }));
    this.tufts = Array.from({ length: 140 }, (_, i) => ({ x: hash(i * 3.3) * VW, y: this.yTop - 6 + hash(i * 5.1) * (VH - this.yTop), h: 3 + hash(i) * 5 }));
    this.patches = Array.from({ length: 6 }, (_, i) => ({ x: hash(i * 9.1) * VW, y: this.yTop + 30 + hash(i * 4.7) * (this.yBot - this.yTop - 40), r: 18 + hash(i) * 26 }));
  },
  // difficulty for the current stage
  cfg() {
    const s = this.stage, storm = Math.max(0, s - 4);
    return {
      interval: Math.max(0.2, ([2.4, 1.95, 1.8, 1.6][Math.min(s, 4) - 1] - storm * 0.13) / this.turbo),
      speed: this.turbo * (s >= 2 ? 1.45 : 1) * (1 + storm * 0.08),
      double: s >= 3 ? Math.min(0.9, 0.45 + storm * 0.1) : 0,
      dark: s >= 4
    };
  },
  depth(y) { return 0.62 + 0.5 * (y - this.yTop) / (this.yBot - this.yTop); },
  target(x, y) { this.m.tx = x ?? rand(40, VW - 40); this.m.ty = y ?? rand(this.yTop + 12, this.yBot - 6); },
  hudTime() { return (prof.lang === 'es' ? 'Nivel ' : 'Level ') + this.stage; },
  hudScore() { return L().hud.poop(this.scooped, this.poops.length, this.lawnMax); },
  update(dt) {
    const m = this.m, k = this.kid;
    this.dark += ((this.cfg().dark ? 1 : 0) - this.dark) * Math.min(1, dt * 1.5);
    if (this.over) { this.overT += dt; m.mode = 'sit'; k.walking = false; return; }
    this.t += dt;
    const st = 1 + Math.floor(this.t / this.stageLen);
    if (st !== this.stage || this.stageShown === 0) {
      this.stage = st; this.stageShown = 1;
      const names = L().stages, nm = names[Math.min(st, names.length) - 1];
      pop(VW / 2, VH * 0.3, `${this.hudTime()}: ${nm}`, '#2A2421', 24);
      if (st > 1) { sfx.bark(); buzz([20, 30, 20]); }
    }
    const C = this.cfg();
    m.timer -= dt;
    const d = this.depth(m.y);
    if (m.mode === 'run' || m.mode === 'fetch') {
      let tx = m.tx, ty = m.ty;
      if (m.mode === 'fetch' && m.ball) { tx = m.ball.x; ty = m.ball.y; }
      const dx = tx - m.x, dy = ty - m.y, dd = Math.hypot(dx, dy);
      const sp = (m.mode === 'fetch' ? 250 : 165) * d * C.speed;
      if (dd > 4) { m.x += dx / dd * sp * dt; m.y += dy / dd * sp * dt * 0.8; if (Math.abs(dx) > 3) m.face = dx > 0 ? 1 : -1; }
      if (dd < 8) {
        if (m.mode === 'fetch') { if (m.ball && m.ball.z <= 0) { m.mode = 'run'; m.ball = null; this.target(); } }
        else this.target();
      }
      if (m.mode === 'run') { this.nextPoop -= dt; if (this.nextPoop <= 0) { m.mode = 'squat'; m.timer = 0.8 / Math.sqrt(this.turbo); } }
      if (m.dirty > 0) { m.dirty -= dt; m.printT -= dt; if (m.printT <= 0) { m.printT = 0.13; this.prints.push({ x: m.x + rand(-4, 4) + m.face * 30 * d * 0.8, y: m.y + rand(-2, 2), life: 4, rot: m.face * Math.PI / 2 }); } }
    } else if (m.mode === 'squat') {
      if (m.timer <= 0) {
        const s = 0.8 * d;
        this.poops.push({ x: m.x - m.face * 6 * s, y: m.y + 2, age: 0, own: 0.8 });
        sfx.plop();
        if (m.extra <= 0 && Math.random() < C.double) { m.extra = 1; m.timer = 0.55 / Math.sqrt(this.turbo); m.x += m.face * 14; }
        else { m.extra = 0; m.mode = 'run'; this.target(); this.nextPoop = C.interval * rand(0.8, 1.2); }
      }
    }
    // Maple stepping in poop
    for (const p of this.poops) {
      p.age += dt * (this.stage >= 3 ? 1.4 : 1); p.own -= dt;

const Tug = {
  id: 'tug', dur: 40,
  init() {

    this.m = 0; this.jerk = 0; this.growl = 0; this.nextGrowl = rand(2.6, 4); this.ring = null; this.nextRing = rand(2.2, 3.5);
    this.GY = VH * 0.7; this.hand = { x: 0, y: 0 }; this.mouth = { x: 0, y: 0 }; this.knot = { x: VW / 2, y: this.GY - 40 }; this.taps = 0;
  },

    let f = 0.17 + 0.0045 * this.t;
    if (this.growl > 0) { this.growl -= dt; f = 0.62; }
    else { this.nextGrowl -= dt; if (this.nextGrowl <= 0) { this.growl = 1.1; this.nextGrowl = rand(2.8, 4.6); pop(VW * 0.72, this.GY - 120, L().pop.grr, '#7C4A22', 22); sfx.growl(); buzz(80); } }
    this.m += f * dt;
    if (this.ring) { this.ring.t += dt; if (this.ring.t > this.ring.dur) { this.ring = null; this.nextRing = rand(2.6, 4.5); } }
    else { this.nextRing -= dt; if (this.nextRing <= 0) this.ring = { t: 0, dur: 1.3 }; }
    if (this.m <= -1) { this.over = true; this.won = true; this.winT = this.t; sfx.win(); }
    else if (this.m >= 1) { this.over = true; this.won = false; sfx.lose(); }
    else if (this.t >= this.dur) { this.over = true; this.won = this.m < 0; this.winT = this.t; (this.won ? sfx.win : sfx.lose)(); }
  },
  down(x, y) {
    if (this.over) return;
    this.taps++; this.m -= 0.042; this.jerk = 1; sfx.pull();
    if (this.ring) {
      const r = this.ringR();
      if (r < 30 && r > 12 && Math.hypot(x - this.knot.x, y - this.knot.y) < 90) {
        this.m -= 0.2; this.ring = null; this.nextRing = rand(2.6, 4.5);
        pop(this.knot.x, this.knot.y - 50, L().pop.big, MC.collarD, 22); sfx.big(); buzz(25); puff(this.knot.x, this.knot.y, '#E8C04A', 14, 140);
      }
    }
  },
  result() {
    const [title, stat] = L().end.tug(this.won, Math.round(this.winT || this.t), this.taps);
    const stars = !this.won ? 0 : this.winT <= 14 ? 3 : this.winT <= 24 ? 2 : 1;
    return { stars, score: this.won ? Math.round(1000 - this.winT * 10) : 0, title, stat };
  },
  draw(c) {
    const g = this.GY;
    // evening living room
    c.fillStyle = '#4E5A7E'; c.fillRect(0, 0, VW, g);
    const glow = c.createRadialGradient(VW * 0.15, g - 180, 10, VW * 0.15, g - 180, 260);
    glow.addColorStop(0, 'rgba(255,214,150,.55)'); glow.addColorStop(1, 'rgba(255,214,150,0)'); c.fillStyle = glow; c.fillRect(0, 0, VW, g);
    // window onto the Wasatch at night
    const wx = VW * 0.52, wy = g - 250, ww = VW * 0.38, wh = 120;
    c.fillStyle = '#F2EBDD'; rr(c, wx - 6, wy - 6, ww + 12, wh + 12, 4); c.fill();
    const ns = c.createLinearGradient(0, wy, 0, wy + wh); ns.addColorStop(0, '#1A1F45'); ns.addColorStop(1, '#3B3F78'); c.fillStyle = ns; c.fillRect(wx, wy, ww, wh);
    c.save(); c.beginPath(); c.rect(wx, wy, ww, wh); c.clip();
    for (let i = 0; i < 20; i++) c.fillStyle = '#FFF6D8', c.fillRect(wx + hash(i) * ww, wy + hash(i + 9) * wh * 0.5, 1.5, 1.5);
    circle(c, wx + ww * 0.78, wy + 24, 10, '#FFF3C4');
    mountains(c, wy + wh, ww + wx, '#2A2F5E', '#C9D2F0', 31);
    c.restore();
    c.fillStyle = '#F2EBDD'; c.fillRect(wx + ww / 2 - 2, wy, 4, wh);
    // lamp
    c.fillStyle = '#3A3F48'; c.fillRect(VW * 0.15 - 2, g - 170, 4, 170); ell(c, VW * 0.15, g - 2, 16, 4, 0, '#3A3F48');
    c.fillStyle = '#F4E3B5'; c.beginPath(); c.moveTo(VW * 0.15 - 18, g - 170); c.lineTo(VW * 0.15 + 18, g - 170); c.lineTo(VW * 0.15 + 10, g - 200); c.lineTo(VW * 0.15 - 10, g - 200); c.closePath(); c.fill();
    // couch behind
    c.fillStyle = '#A65D48'; rr(c, VW * 0.3, g - 100, VW * 0.6, 70, 16); c.fill();
    c.fillStyle = '#8E4E3C'; rr(c, VW * 0.27, g - 80, 28, 60, 12); c.fill(); rr(c, VW * 0.87, g - 80, 28, 60, 12); c.fill();
    c.fillStyle = '#E8C04A'; rr(c, VW * 0.34, g - 94, 30, 24, 8); c.fill();
    // floor + rug
    c.fillStyle = '#8E6440'; c.fillRect(0, g, VW, VH - g);
    c.strokeStyle = 'rgba(40,20,10,.25)'; c.lineWidth = 1.2;
    for (let y = g + 14; y < VH; y += 16) { c.beginPath(); c.moveTo(0, y); c.lineTo(VW, y); c.stroke(); }
    ell(c, VW / 2, g + 30, VW * 0.46, 38, 0, '#D9B88A'); ell(c, VW / 2, g + 30, VW * 0.38, 30, 0, '#C99A62'); ell(c, VW / 2, g + 30, VW * 0.28, 22, 0, '#E6CFA6');
    // win lines
    const lineOff = VW * 0.17;
    c.fillStyle = MC.collar; c.fillRect(VW / 2 - lineOff - 2, g + 6, 4, 50);
    c.fillStyle = '#E0673F'; c.fillRect(VW / 2 + lineOff - 2, g + 6, 4, 50);
    c.fillStyle = '#FFF8EC'; c.fillRect(VW / 2 - 1, g + 12, 2, 40);
    // actors
    const off = this.m * lineOff;
    let px = VW * 0.25 + off * 0.45, mx = VW * 0.72 + off;
    let mPose = this.growl > 0 ? 'shake' : 'pull', mFace = -1;
    let pPose = 'tug';
    if (this.over) {
      if (this.won) { mPose = 'sit'; pPose = 'cheer'; }
      else { mPose = 'run'; mFace = 1; mx += this.overT * 260; pPose = 'oof'; }
    }
    const hand = {}, mouth = {};
    drawPerson(c, px, g + 20, 1.15, pPose, now, 1, { jerk: this.jerk, out: hand });
    drawMaple(c, mx + (mFace < 0 ? 30 : -30), g + 20, 1.15, mPose, now, mFace, { mouthOut: mouth });
    // rope toy
    let ax = hand.x, ay = hand.y, bx = mouth.x, by = mouth.y;
    if (this.over && this.won) { ax = hand.x; ay = hand.y; bx = VW / 2 - lineOff; by = g + 14; }
    if (this.over && !this.won) { ax = mouth.x - 60; ay = g + 10; }
    const midx = (ax + bx) / 2, midy = (ay + by) / 2 + 8;
    const rope = (col, w, dash, offd) => { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.setLineDash(dash); c.lineDashOffset = offd; c.beginPath(); c.moveTo(ax, ay); c.quadraticCurveTo(midx, midy + 6, bx, by); c.stroke(); c.setLineDash([]); };
    rope('#EFE6D2', 8, [], 0); rope(MC.collar, 8, [7, 7], 0); rope('#E0673F', 4, [7, 7], 7);
    this.knot = { x: midx, y: (ay + by) / 2 + 10 };
    circle(c, this.knot.x, this.knot.y, 9, '#EFE6D2'); circle(c, this.knot.x - 3, this.knot.y - 2, 4, MC.collar); circle(c, this.knot.x + 3, this.knot.y + 2, 4, '#E0673F');
    // gold ring
    if (this.ring && !this.over) {
      const r = this.ringR();
      c.strokeStyle = 'rgba(232,192,74,.45)'; c.lineWidth = 3; c.beginPath(); c.arc(this.knot.x, this.knot.y, 21, 0, TAU); c.stroke();
      c.strokeStyle = r < 30 && r > 12 ? '#FFD84A' : '#E8C04A'; c.lineWidth = 5; c.beginPath(); c.arc(this.knot.x, this.knot.y, r, 0, TAU); c.stroke();
    }
    // tug meter
    const bx0 = 22, bw = VW - 44, by0 = hudB + 10;
    c.fillStyle = 'rgba(255,248,236,.92)'; rr(c, bx0 - 6, by0 - 6, bw + 12, 26, 13); c.fill();
    c.strokeStyle = '#2A2421'; c.lineWidth = 2; rr(c, bx0 - 6, by0 - 6, bw + 12, 26, 13); c.stroke();
    c.fillStyle = MC.collar; rr(c, bx0, by0, bw / 2, 14, 7); c.fill();
    c.fillStyle = '#E0673F'; rr(c, bx0 + bw / 2, by0, bw / 2, 14, 7); c.fill();
    const mk = bx0 + bw / 2 + clamp(this.m, -1, 1) * bw / 2;
    circle(c, mk, by0 + 7, 11, '#FFF8EC'); c.strokeStyle = '#2A2421'; c.lineWidth = 2; c.beginPath(); c.arc(mk, by0 + 7, 11, 0, TAU); c.stroke();
    circle(c, mk, by0 + 7, 4, '#2A2421');
  }
};

const LEVELS = [Poop, Chase, Garden, Tug];

/* ============================== HERO (menu) ============================== */
const hero = $('hero'), hx = hero.getContext('2d');
let heroW = 300, heroH = 170;
function resizeHero() {
  const r = hero.getBoundingClientRect();
  heroW = r.width || 300; heroH = r.height || 170;
  hero.width = Math.round(heroW * dpr); hero.height = Math.round(heroH * dpr);
}
function drawHero() {
  if ($('menu').hidden) return;
  const c = hx; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gy = heroH * 0.74;
  const sk = c.createLinearGradient(0, 0, 0, gy); sk.addColorStop(0, '#8FCBEF'); sk.addColorStop(1, '#DDF0F8'); c.fillStyle = sk; c.fillRect(0, 0, heroW, heroH);
  mountains(c, gy - 30, heroW, '#8DA2C4', '#FFFFFF', 7);
  c.fillStyle = '#B98C5E'; c.fillRect(0, gy - 44, heroW, 40); c.fillStyle = '#A67A4E'; for (let x = 0; x < heroW; x += 18) c.fillRect(x, gy - 44, 2, 40);
  c.fillStyle = '#7DA84A'; c.fillRect(0, gy - 6, heroW, heroH - gy + 6);
  c.strokeStyle = 'rgba(40,80,25,.4)'; c.lineWidth = 1.2; c.beginPath();
  for (let i = 0; i < 60; i++) { const x = (hash(i * 3.1) * heroW - now * 60) % heroW, y = gy + hash(i * 7.3) * (heroH - gy); const xx = x < 0 ? x + heroW : x; c.moveTo(xx, y); c.lineTo(xx - 1.5, y - 5); }
  c.stroke();
  for (let i = 0; i < 3; i++) { const x = ((i * 130 + 60 - now * 60) % (heroW + 60) + heroW + 60) % (heroW + 60) - 30; tennisBall(c, x, gy + 10 + i * 6, 6); }
  const cyc = (now * 1.1) % 1, lift = Math.sin(cyc * Math.PI) * 22;
  drawMaple(c, heroW * 0.36, gy + 16, 1.05, lift > 4 ? 'leap' : 'run', now, 1, { lift });
}

/* ============================== UI FLOW ============================== */
let state = 'menu', cur = null, curIdx = 0, endShown = false;

function recordFor(name, id) { return (records[name] || {})[id]; }
function familyTop(id) {
  let best = null;
  for (const [n, r] of Object.entries(records)) { const x = r[id]; if (x && (!best || x.stars > best.stars || (x.stars === best.stars && x.score > best.score))) best = { name: n, ...x }; }
  return best;
}

function renderMenu() {
  const t = L();
  document.documentElement.lang = prof.lang;
  $('mKicker').textContent = t.kicker; $('mTitle').innerHTML = t.title;
  $('lPlayer').textContent = t.lPlayer; $('inPlayer').placeholder = t.playerDefault;
  $('mFoot').textContent = t.foot;
  $('langEn').setAttribute('aria-pressed', String(prof.lang === 'en'));
  $('langEs').setAttribute('aria-pressed', String(prof.lang === 'es'));
  const names = Object.keys(records);
  $('chips').innerHTML = names.map(n => `<button class="chip" data-n="${esc(n)}" aria-pressed="${n === playerName()}">${esc(n)}</button>`).join('');
  $('levels').innerHTML = LEVELS.map((lv, i) => {
    const info = t.lv[lv.id], mine = recordFor(playerName(), lv.id), top = familyTop(lv.id);
    return `<button class="lvl" data-i="${i}">
      <span class="num">${i + 1}</span>
      <span><div class="nm">${esc(info.name)}</div><div class="pl">${esc(info.place)}</div>${top ? `<div class="top">${esc(t.famTop(top.name, '★'.repeat(top.stars)))}</div>` : ''}</span>
      <span class="stars">${starStr(mine ? mine.stars : 0)}</span></button>`;
  }).join('');
}

function setHud() {
  if (!cur) return;
  $('hudTitle').textContent = L().lv[cur.id].name;
  $('hudTime').textContent = cur.hudTime ? cur.hudTime() : Math.max(0, Math.ceil(cur.dur - cur.t));
  $('hudScore').textContent = cur.hudScore();
  $('mute').textContent = muted ? 'OFF' : 'SND';
}

function measureHud() { const r = $('hud').getBoundingClientRect(); hudB = (r.bottom || 70) / S; }

function openIntro(i) {
  curIdx = i; cur = LEVELS[i];
  pops = []; parts = []; mud = [];
  $('hud').hidden = false; measureHud();
  cur.init();
  const info = L().lv[cur.id];
  $('iKicker').textContent = info.place; $('iTitle').textContent = info.name; $('iHow').textContent = info.how;
  $('goBtn').textContent = L().start; $('backBtn').textContent = L().levels;
  $('menu').hidden = true; $('end').hidden = true; $('intro').hidden = false;
  state = 'intro'; setHud();
  $('goBtn').focus({ preventScroll: true });
}
function startLevel() {
  pops = []; parts = []; mud = [];
  cur.init();
  $('intro').hidden = true; $('end').hidden = true;
  state = 'play'; endShown = false;
  try { actx().resume && ac.resume(); } catch (e) {}
  sfx.bark();
}
function showEnd() {
  endShown = true; state = 'end';
  const r = cur.result(), name = playerName(), t = L();
  const prev = recordFor(name, cur.id);
  const better = !prev || r.stars > prev.stars || (r.stars === prev.stars && r.score > prev.score);
  if (better && (r.stars > 0 || !prev)) { records[name] = records[name] || {}; records[name][cur.id] = { stars: r.stars, score: r.score }; save(); }
  $('eStars').innerHTML = starStr(r.stars);
  $('eTitle').textContent = r.title; $('eStat').textContent = r.stat;
  $('eNew').textContent = t.newBest; $('eNew').hidden = !(better && prev && r.stars > 0);
  const top = familyTop(cur.id);
  $('eFam').textContent = top ? t.famTop(top.name, '★'.repeat(top.stars)) : t.noFam;
  const last = curIdx === LEVELS.length - 1;
  $('nextBtn').textContent = last ? t.allDone : t.next;
  $('retryBtn').textContent = t.retry; $('levelsBtn').textContent = t.levels;
  $('end').hidden = false;
}
function toMenu() {
  state = 'menu'; cur = null;
  $('hud').hidden = true; $('intro').hidden = true; $('end').hidden = true; $('menu').hidden = false;
  renderMenu(); resizeHero();
}

/* ============================== LOOP ============================== */
let lastT = 0;
function drawIdleBackdrop(c) {
  const sk = c.createLinearGradient(0, 0, 0, VH); sk.addColorStop(0, '#8FCBEF'); sk.addColorStop(0.6, '#DDF0F8'); sk.addColorStop(0.6, '#7DA84A'); sk.addColorStop(1, '#5A8633');
  c.fillStyle = sk; c.fillRect(0, 0, VW, VH);
  mountains(c, VH * 0.6, VW, '#8DA2C4', '#FFFFFF', 5);
}
function loop(ts) {
  const dt = Math.min(0.033, (ts - lastT) / 1000 || 0); lastT = ts; now += dt;
  cx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  if (cur && (state === 'play' || state === 'end')) {
    cur.update(dt); updateFx(dt);
    if (state === 'play') { setHud(); if (cur.over && !endShown && cur.overT > (cur.id === 'chase' && cur.won ? 1.8 : 1.3)) showEnd(); }
  } else updateFx(dt);
  if (cur) { cur.draw(cx); drawFx(cx); } else drawIdleBackdrop(cx);
  drawHero();
  requestAnimationFrame(loop);
}

/* ============================== INPUT ============================== */
const pt = e => ({ x: e.clientX / S, y: e.clientY / S });
cv.addEventListener('pointerdown', e => { e.preventDefault(); if (state !== 'play' || !cur) return; const p = pt(e); cur.down && cur.down(p.x, p.y); try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener('pointermove', e => { if (state === 'play' && cur && cur.move) { const p = pt(e); cur.move(p.x, p.y); } });
const up = () => { if (cur && cur.up) cur.up(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
window.addEventListener('keydown', e => {
  if (state !== 'play' || !cur || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (cur.id === 'chase' || cur.id === 'tug') cur.down(cur.knot ? cur.knot.x : 0, cur.knot ? cur.knot.y : 0); }
});

$('inPlayer').value = prof.player;
$('inPlayer').addEventListener('input', () => { prof.player = $('inPlayer').value.trim(); save(); renderMenu(); });
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; prof.player = b.dataset.n; $('inPlayer').value = prof.player; save(); renderMenu(); });
$('levels').addEventListener('click', e => { const b = e.target.closest('.lvl'); if (b) openIntro(+b.dataset.i); });
$('langEn').addEventListener('click', () => { prof.lang = 'en'; save(); renderMenu(); });
$('langEs').addEventListener('click', () => { prof.lang = 'es'; save(); renderMenu(); });
$('goBtn').addEventListener('click', startLevel);
$('backBtn').addEventListener('click', toMenu);
$('retryBtn').addEventListener('click', () => { $('end').hidden = true; startLevel(); });
$('levelsBtn').addEventListener('click', toMenu);
$('nextBtn').addEventListener('click', () => { if (curIdx < LEVELS.length - 1) openIntro(curIdx + 1); else toMenu(); });
$('exitBtn').addEventListener('click', toMenu);
$('mute').addEventListener('click', () => { muted = !muted; try { localStorage.setItem('maple-muted', muted ? '1' : '0'); } catch (e) {} if (muted && silentEl) silentEl.pause(); if (!muted) { unlockAudio(); sfx.bark(); } setHud(); renderMenuSound(); });
document.addEventListener('visibilitychange', () => { lastT = performance.now(); });
window.addEventListener('resize', () => { resize(); if (cur) measureHud(); });

function renderMenuSound() {
  const es = prof.lang === 'es';
  $('menuSound').textContent = muted ? (es ? 'Sonido apagado' : 'Sound off') : (es ? 'Sonido encendido' : 'Sound on');
  $('menuSound').setAttribute('aria-pressed', String(!muted));
}
$('menuSound').addEventListener('click', () => $('mute').click());
$('langEn').addEventListener('click', renderMenuSound); $('langEs').addEventListener('click', renderMenuSound);
resize(); renderMenu(); resizeHero(); renderMenuSound();
requestAnimationFrame(loop);
})();
</script>
